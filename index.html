    <script>
      (function () {
        // Intercept Vite HMR WebSocket creation to eliminate 'WebSocket closed without opened' errors in AI Studio preview
        if (typeof window !== 'undefined') {
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function (url, protocols) {
              const isViteHmr =
                protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/')));

              if (isViteHmr) {
                const target = new EventTarget();
                target.readyState = 1; // WebSocket.OPEN
                target.CONNECTING = 0;
                target.OPEN = 1;
                target.CLOSING = 2;
                target.CLOSED = 3;
                target.url = url;
                target.protocol = 'vite-hmr';
                target.extensions = '';
                target.bufferedAmount = 0;
                target.binaryType = 'blob';
                target.send = function () {};
                target.close = function () {
                  target.readyState = 3;
                  if (typeof target.onclose === 'function') {
                    target.onclose(new CloseEvent('close', { code: 1000, wasClean: true }));
                  }
                  target.dispatchEvent(new CloseEvent('close', { code: 1000, wasClean: true }));
                };
                target.onopen = null;
                target.onclose = null;
                target.onerror = null;
                target.onmessage = null;

                setTimeout(function () {
                  if (typeof target.onopen === 'function') {
                    target.onopen(new Event('open'));
                  }
                  target.dispatchEvent(new Event('open'));
                }, 0);

                return target;
              }

              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
            window.WebSocket.prototype = OrigWebSocket.prototype;
          }

          // Intercept console.error and console.warn for any remaining benign Vite HMR notices
          const origError = console.error;
          console.error = function () {
            const args = Array.prototype.slice.call(arguments);
            const text = args.map(function (a) {
              return (a && (a.message || a.stack || String(a))) || '';
            }).join(' ');
            if (
              text.includes('[vite]') ||
              text.includes('WebSocket closed without opened') ||
              text.includes('failed to connect to websocket')
            ) {
              return;
            }
            origError.apply(console, args);
          };

          const origWarn = console.warn;
          console.warn = function () {
            const args = Array.prototype.slice.call(arguments);
            const text = args.map(function (a) {
              return (a && (a.message || a.stack || String(a))) || '';
            }).join(' ');
            if (
              text.includes('[vite]') ||
              text.includes('WebSocket') ||
              text.includes('websocket')
            ) {
              return;
            }
            origWarn.apply(console, args);
          };

          window.addEventListener('unhandledrejection', function (event) {
            const reason = event.reason;
            const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
            if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function (event) {
            const msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
