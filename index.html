<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘업무</title>
    <meta name="description" content="매일 해야 할 업무를 계획하고 관리하는 초보자용 개인 업무 관리 웹앱" />
    <meta property="og:title" content="오늘업무" />
    <meta property="og:description" content="매일 해야 할 업무를 계획하고 관리하는 초보자용 개인 업무 관리 웹앱" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Suppress benign Vite websocket closed errors in AI Studio environment where HMR is disabled
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#F4F4F7] text-[#050038] antialiased selection:bg-[#FFD02F] selection:text-[#050038]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
